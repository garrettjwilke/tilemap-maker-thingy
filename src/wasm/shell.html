<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tilemap Maker</title>
    <meta name="description" content="Tilemap Maker and Tileset Editor in WebAssembly">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1a1c23;
            color: #d1d5db;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            touch-action: none;
        }
        canvas#canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100% !important;
            height: 100% !important;
            display: block;
            outline: none;
            cursor: default;
            touch-action: none;
        }
        #loading-overlay {
            position: absolute;
            inset: 0;
            background: #14161d;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: opacity 0.3s ease;
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid #6366f1;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        #status-text {
            font-size: 15px;
            font-weight: 500;
            color: #9ca3af;
            letter-spacing: 0.5px;
        }
        #drop-overlay {
            display: none;
            position: absolute;
            inset: 12px;
            border: 2px dashed #6366f1;
            border-radius: 12px;
            background: rgba(26, 28, 35, 0.85);
            backdrop-filter: blur(4px);
            z-index: 200;
            pointer-events: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }
        #drop-overlay h2 {
            font-size: 22px;
            font-weight: 600;
            color: #e0e7ff;
            margin-bottom: 8px;
        }
        #drop-overlay p {
            font-size: 14px;
            color: #a5b4fc;
        }
    </style>
</head>
<body>
    <div id="canvas-container">
        <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
        <div id="loading-overlay">
            <div class="spinner"></div>
            <div id="status-text">Loading Tilemap Maker...</div>
        </div>
        <div id="drop-overlay">
            <h2>Drop file to load</h2>
            <p>Supports .json maps, .png/.terrain tilesets, and .tilesetproj projects (you can drop .png + .terrain together)</p>
        </div>
    </div>
    <input type="file" id="wasm-file-input" style="display: none;">

    <div id="debug-pinch-controls" style="display:none; position:fixed; bottom:12px; left:12px; z-index:9999; background:rgba(0,0,0,0.85); padding:8px 12px; border-radius:8px; border:1px solid #4f46e5; gap:8px; align-items:center;">
        <span style="color:#fff;font-size:12px;font-family:sans-serif;font-weight:600;">Pinch Test:</span>
        <button id="btn-pinch-zoom-in" style="background:#4f46e5;color:white;border:none;border-radius:4px;padding:4px 10px;cursor:pointer;font-size:12px;">Zoom In (Pinch)</button>
        <button id="btn-pinch-zoom-out" style="background:#4f46e5;color:white;border:none;border-radius:4px;padding:4px 10px;cursor:pointer;font-size:12px;">Zoom Out (Pinch)</button>
    </div>

    <div id="debug-terrain-controls" style="display:none; position:fixed; bottom:12px; left:12px; z-index:9999; background:rgba(0,0,0,0.85); padding:8px 12px; border-radius:8px; border:1px solid #10b981; gap:8px; align-items:center;">
        <span style="color:#fff;font-size:12px;font-family:sans-serif;font-weight:600;">Terrain Test:</span>
        <button id="btn-test-terrain-only" style="background:#10b981;color:white;border:none;border-radius:4px;padding:4px 10px;cursor:pointer;font-size:12px;">Test Terrain Alone</button>
        <button id="btn-test-terrain-both" style="background:#10b981;color:white;border:none;border-radius:4px;padding:4px 10px;cursor:pointer;font-size:12px;">Test Both (.png + .terrain)</button>
    </div>

    <script type="text/javascript">
        if (window.location.search.includes('test_terrain')) {
            const controls = document.getElementById('debug-terrain-controls');
            if (controls) controls.style.display = 'flex';
            document.getElementById('btn-test-terrain-only').addEventListener('click', () => {
                const terrainJson = JSON.stringify({
                    version: 1,
                    tile_size: 16,
                    tileset: "lonely_tiles.png",
                    variants: [{ x: 12, y: 0, root_x: 9, root_y: 2, probability: 0.5 }]
                });
                const encoder = new TextEncoder();
                FS.writeFile('/uploads/lonely_tiles.terrain', encoder.encode(terrainJson));
                const pathPtr = stringToNewUTF8('/uploads/lonely_tiles.terrain');
                Module._wasm_on_file_uploaded(pathPtr, 2);
                _free(pathPtr);
            });
            document.getElementById('btn-test-terrain-both').addEventListener('click', () => {
                const terrainJson = JSON.stringify({
                    version: 1,
                    tile_size: 16,
                    tileset: "bundle_tiles.png",
                    variants: [{ x: 12, y: 0, root_x: 9, root_y: 2, probability: 0.5 }]
                });
                const encoder = new TextEncoder();
                FS.writeFile('/uploads/bundle_tiles.terrain', encoder.encode(terrainJson));
                fetch('/test_dummy.png').then(r => r.arrayBuffer()).then(buf => {
                    FS.writeFile('/uploads/bundle_tiles.png', new Uint8Array(buf));
                    const pathPtr = stringToNewUTF8('/uploads/bundle_tiles.terrain');
                    Module._wasm_on_file_uploaded(pathPtr, 2);
                    _free(pathPtr);
                });
            });
        }
        if (window.location.search.includes('test_pinch')) {
            const controls = document.getElementById('debug-pinch-controls');
            if (controls) controls.style.display = 'flex';
            document.getElementById('btn-pinch-zoom-in').addEventListener('click', () => {
                const canvas = document.getElementById('canvas');
                const rect = canvas.getBoundingClientRect();
                const evt = new WheelEvent('wheel', {
                    ctrlKey: true,
                    deltaY: -40,
                    clientX: rect.width * 0.5,
                    clientY: rect.height * 0.5,
                    bubbles: true,
                    cancelable: true
                });
                window.dispatchEvent(evt);
            });
            document.getElementById('btn-pinch-zoom-out').addEventListener('click', () => {
                const canvas = document.getElementById('canvas');
                const rect = canvas.getBoundingClientRect();
                const evt = new WheelEvent('wheel', {
                    ctrlKey: true,
                    deltaY: 40,
                    clientX: rect.width * 0.5,
                    clientY: rect.height * 0.5,
                    bubbles: true,
                    cancelable: true
                });
                window.dispatchEvent(evt);
            });
        }
        var statusElement = document.getElementById('status-text');
        var loadingOverlay = document.getElementById('loading-overlay');

        var Module = {
            preRun: [],
            postRun: [function() {
                if (loadingOverlay) {
                    loadingOverlay.style.opacity = '0';
                    setTimeout(function() {
                        loadingOverlay.style.display = 'none';
                    }, 300);
                }
            }],
            print: function(text) {
                console.log(text);
            },
            printErr: function(text) {
                console.error(text);
            },
            canvas: (function() {
                var canvas = document.getElementById('canvas');
                canvas.addEventListener("webglcontextlost", function(e) {
                    alert('WebGL context lost. You will need to reload the page.');
                    e.preventDefault();
                }, false);
                return canvas;
            })(),
            setStatus: function(text) {
                if (!Module.setStatus.last) Module.setStatus.last = { time: Date.now(), text: '' };
                if (text === Module.setStatus.last.text) return;
                var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
                var now = Date.now();
                if (m && now - Module.setStatus.last.time < 30) return;
                Module.setStatus.last.time = now;
                Module.setStatus.last.text = text;
                if (statusElement) {
                    statusElement.textContent = text || 'Ready';
                }
            },
            totalDependencies: 0,
            monitorRunDependencies: function(left) {
                this.totalDependencies = Math.max(this.totalDependencies, left);
                Module.setStatus(left ? 'Preparing... (' + (this.totalDependencies - left) + '/' + this.totalDependencies + ')' : 'All downloads complete.');
            }
        };

        Module.setStatus('Downloading...');
        window.onerror = function(event) {
            Module.setStatus('Exception thrown, see JavaScript console');
            if (loadingOverlay) loadingOverlay.style.display = 'none';
            Module.setStatus = function(text) {
                if (text) console.error('[post-exception status] ' + text);
            };
        };
    </script>
    <script async type="text/javascript" src="tilemap-maker.js"></script>
</body>
</html>
