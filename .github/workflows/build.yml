name: Build

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub Release'
        type: boolean
        default: true
      tag_name:
        description: 'Tag name (e.g. v0.1.0, or leave empty for auto-tag)'
        type: string
        default: ''
      release_title:
        description: 'Release title (leave empty to use tag name)'
        type: string
        default: ''
      draft:
        description: 'Save as draft'
        type: boolean
        default: false
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            libasound2-dev \
            libpulse-dev \
            libaudio-dev \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxfixes-dev \
            libxi-dev \
            libxss-dev \
            libxtst-dev \
            libwayland-dev \
            wayland-protocols \
            libxkbcommon-dev \
            libdrm-dev \
            libgbm-dev \
            libgl1-mesa-dev \
            libgles2-mesa-dev \
            libegl1-mesa-dev \
            libdbus-1-dev \
            libudev-dev \
            libgtk-3-dev

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Prepare artifacts
        shell: bash
        run: |
          mkdir -p dist
          if [ -f build/tilemap-maker ]; then
            cp build/tilemap-maker dist/
          fi
          if [ -f build/tilemap-maker.exe ]; then
            cp build/tilemap-maker.exe dist/
          fi
          if [ -f build/Release/tilemap-maker.exe ]; then
            cp build/Release/tilemap-maker.exe dist/
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tilemap-maker-${{ matrix.os }}
          path: dist/*

  build-wasm:
    name: Build (WASM)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14

      - name: Build WASM
        run: |
          emcmake cmake -B build-wasm -DCMAKE_BUILD_TYPE=Release
          cmake --build build-wasm --config Release --parallel

      - name: Prepare WASM artifacts
        run: |
          mkdir -p dist-wasm
          cp build-wasm/dist/* dist-wasm/

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tilemap-maker-wasm
          path: dist-wasm/*

  release:
    name: Create Release
    needs: [build, build-wasm]
    if: ${{ github.event.inputs.create_release == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package release assets
        run: |
          mkdir -p release-assets
          
          # Linux
          if [ -f artifacts/tilemap-maker-ubuntu-latest/tilemap-maker ]; then
            chmod +x artifacts/tilemap-maker-ubuntu-latest/tilemap-maker
            tar -czvf release-assets/tilemap-maker-linux.tar.gz -C artifacts/tilemap-maker-ubuntu-latest tilemap-maker
          fi
          
          # macOS
          if [ -f artifacts/tilemap-maker-macos-latest/tilemap-maker ]; then
            chmod +x artifacts/tilemap-maker-macos-latest/tilemap-maker
            zip -j release-assets/tilemap-maker-macos.zip artifacts/tilemap-maker-macos-latest/tilemap-maker
          fi
          
          # Windows
          if [ -f artifacts/tilemap-maker-windows-latest/tilemap-maker.exe ]; then
            zip -j release-assets/tilemap-maker-windows.zip artifacts/tilemap-maker-windows-latest/tilemap-maker.exe
          fi

          # WebAssembly
          if [ -d artifacts/tilemap-maker-wasm ]; then
            zip -j release-assets/tilemap-maker-web.zip artifacts/tilemap-maker-wasm/*
          fi

      - name: Determine tag name
        id: tag
        run: |
          INPUT_TAG="${{ github.event.inputs.tag_name }}"
          if [ -n "$INPUT_TAG" ]; then
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$(date +'%Y.%m.%d-%H%M%S')" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ github.event.inputs.release_title != '' && github.event.inputs.release_title || steps.tag.outputs.tag }}
          draft: ${{ github.event.inputs.draft == 'true' }}
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          files: release-assets/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
